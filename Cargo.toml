[package]
name = "ripsem"
version = "0.1.2"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
description = "Local, offline semantic code search with an MCP server for coding agents"
repository = "https://github.com/Sadykhzadeh/ripsem"
homepage = "https://github.com/Sadykhzadeh/ripsem"
readme = "README.md"
keywords = ["search", "grep", "semantic", "embeddings", "mcp"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["docs/", "npm/"]

[dependencies]
anyhow = "1.0.102"
bitcode = { version = "0.6.9", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.11"
content_inspector = "0.2.4"
directories = "6.0.0"
fastembed = { version = "7.0.0", optional = true }
ignore = "0.4.26"
indicatif = "0.18.4"
instant-distance = { version = "0.6.1", optional = true, features = ["with-serde"] }
notify = "8.2.0"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tree-sitter = { version = "0.27", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-css = { version = "0.25", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-kotlin-ng = { version = "1.1", optional = true }
tree-sitter-php = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-scala = { version = "0.26", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
walkdir = "2.5.0"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }

[features]
default = ["fastembed", "treesitter"]
fastembed = ["dep:fastembed"]
hnsw = ["dep:instant-distance"]
treesitter = [
    "dep:tree-sitter",
    "dep:tree-sitter-bash",
    "dep:tree-sitter-c",
    "dep:tree-sitter-c-sharp",
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-css",
    "dep:tree-sitter-go",
    "dep:tree-sitter-html",
    "dep:tree-sitter-java",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-json",
    "dep:tree-sitter-kotlin-ng",
    "dep:tree-sitter-php",
    "dep:tree-sitter-python",
    "dep:tree-sitter-ruby",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-scala",
    "dep:tree-sitter-typescript",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
