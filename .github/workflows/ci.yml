name: ci

on:
  push:
    branches: [master]
  pull_request:
  # An advisory can land against a dependency that has not changed, so the
  # audit below also runs on its own without anybody pushing.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-features --all-targets -- -D warnings
      - name: Test
        run: cargo test --no-default-features --all-targets
      - name: Test pure-Rust features
        run: cargo test --no-default-features --features treesitter,hnsw --all-targets
      - name: Build all features
        run: cargo build --all-features

  # The ONNX Runtime that ort downloads is built against glibc 2.38 and GCC 13,
  # and links against an older C and C++ runtime only through the symbols in
  # src/embed/ort_compat.rs. ubuntu-latest is new enough not to need them, so
  # this job builds where they are needed: the glibc 2.35 and libstdc++ 12 of
  # Ubuntu 22.04, the oldest system the install instructions promise. The model
  # test and the search run the runtime, not just link it.
  real-backend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Test with the embedding model
        run: |
          cargo test --features fastembed,treesitter --all-targets
          cargo test --features fastembed,treesitter --test semantic_search -- --ignored
      - name: Index and search with the model
        run: |
          cargo build --features fastembed,treesitter
          ripsem=$PWD/target/debug/ripsem
          mkdir "$RUNNER_TEMP/repo"
          cp -R src "$RUNNER_TEMP/repo/"
          cd "$RUNNER_TEMP/repo"
          "$ripsem" init
          "$ripsem" index
          "$ripsem" search "load the embedding model" --context 0 | tee hits
          grep -q 'src/embed/fastembed.rs' hits

  # The rust-version in Cargo.toml. Every other job builds on stable, which
  # would not notice a change that needs a later compiler.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # 1.92
        with:
          toolchain: '1.92'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo check --locked --all-targets --all-features

  # Renovate keeps Cargo.toml current, and an advisory is usually against a
  # transitive crate that only the lockfile names. A separate job, so an
  # advisory does not hide the state of the gates above.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@375b74606b681357a78b6488a4828b3b84bdd155 # cargo-audit
        with:
          tool: cargo-audit
      - run: cargo audit

  # Paths are the part of this that is not portable: the index stores
  # forward-slash repo-relative paths, the walker judges them against the root,
  # the temp-file replace on save has to work, and status strips the verbatim
  # `\\?\` prefix. All of that is tested, and none of it was tested anywhere it
  # could actually fail.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Test pure-Rust features
        run: cargo test --no-default-features --features treesitter,hnsw --all-targets
