name: release

# A `v*` tag builds ripsem with the embedding runtime and tree-sitter for each
# platform below and publishes the archives, their SHA-256 sums and build
# provenance as a GitHub release of that tag, with the tag's CHANGELOG section
# as its notes, then the crate to crates.io and the packages to npm. Run by hand on a branch, it builds, tests and uploads the
# archives as artifacts of the run without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The licences of what every archive contains, gathered once: the Rust crates,
  # and ONNX Runtime with the libraries it bundles, which ort links statically.
  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # Checked before anything is built, so a tag that does not match what
      # it releases fails in seconds.
      - name: Check the tag against Cargo.toml and the changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=${GITHUB_REF_NAME#v}
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          [ "$version" = "$crate" ] || { echo "tag $GITHUB_REF_NAME, Cargo.toml $crate"; exit 1; }
          heading=$(grep -m1 "^## $version " CHANGELOG.md) || { echo "CHANGELOG.md has no $version section"; exit 1; }
          case $heading in *unreleased*) echo "CHANGELOG.md still calls $version unreleased"; exit 1 ;; esac
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-about@0.9.2
      - name: Collect notices
        run: |
          out=third-party-notices
          mkdir "$out"
          cargo about generate --locked --features fastembed,treesitter \
            -c third-party/about.toml -o "$out/rust-crates.txt" third-party/about.hbs
          # ort-sys downloads the ONNX Runtime release its dist table names.
          ort_sys=$(cargo metadata --locked --format-version 1 --features fastembed |
            jq -r '.packages[] | select(.name == "ort-sys") | .manifest_path')
          ort=$(grep -m1 -o 'ms@[0-9.]*' "$(dirname "$ort_sys")/build/download/dist.tsv")
          base=https://raw.githubusercontent.com/microsoft/onnxruntime/v${ort#ms@}
          curl -fsSL -o "$out/onnxruntime-LICENSE.txt" "$base/LICENSE"
          curl -fsSL -o "$out/onnxruntime-ThirdPartyNotices.txt" "$base/ThirdPartyNotices.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: third-party-notices
          path: third-party-notices/
          if-no-files-found: error

  build:
    needs: notices
    strategy:
      matrix:
        include:
          # glibc symbols bind to the version a binary is linked against, so
          # the Linux build runs on the oldest system it supports: built here
          # it needs glibc 2.35, built on ubuntu-latest it would need 2.39.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: third-party-notices
          path: third-party-notices
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --features fastembed,treesitter
        env:
          # Where ort unpacks the ONNX Runtime it downloads, so the package
          # step knows where to find the files that ship with it.
          ORT_CACHE_DIR: ${{ github.workspace }}/ort-cache
          # The macOS ONNX Runtime is built for macOS 13.4 and later, so the
          # binary says so instead of claiming Rust's default of 11.0.
          MACOSX_DEPLOYMENT_TARGET: '13.4'
      - name: Package
        run: |
          # A manual run on a branch such as fix/x has a slash in its name.
          name=ripsem-${GITHUB_REF_NAME//\//-}-${{ matrix.target }}
          mkdir "$name"
          cp README.md LICENSE "$name/"
          cp -R third-party-notices "$name/third-party"
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/${{ matrix.target }}/release/ripsem.exe "$name/"
            # The Windows ONNX Runtime is linked against the DirectML.dll it
            # comes with, which has to sit next to the executable.
            cp ort-cache/dfbin/*/*/DirectML.dll "$name/"
            # third-party/directml holds the licence of DirectML 1.15.4, so a
            # different DLL stops the release until its licence is checked in.
            dml=$(powershell -NoProfile -Command \
              '(Get-Item ort-cache/dfbin/*/*/DirectML.dll).VersionInfo.ProductVersion' | tr -d '\r')
            case $dml in
              1.15.4+*) ;;
              *) echo "DirectML.dll is $dml, third-party/directml is for 1.15.4"; exit 1 ;;
            esac
            cp third-party/directml/LICENSE.txt "$name/third-party/DirectML-LICENSE.txt"
            cp third-party/directml/ThirdPartyNotices.txt "$name/third-party/DirectML-ThirdPartyNotices.txt"
          else
            cp target/${{ matrix.target }}/release/ripsem "$name/"
          fi
          echo "PACKAGE=$name" >> "$GITHUB_ENV"
      # Runs the packaged binary, from a directory of its own, the way a user
      # would after unpacking it: a missing library fails here, not for them.
      - name: Index and search with the packaged binary
        run: |
          ripsem=$PWD/$PACKAGE/ripsem
          mkdir smoke
          cp -R src smoke/
          cd smoke
          "$ripsem" init
          "$ripsem" index
          "$ripsem" search "load the embedding model" --context 0 | tee hits
          grep -q 'src/embed/fastembed.rs' hits
      - name: Archive
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$PACKAGE.zip" "$PACKAGE"
          else
            tar -czf "$PACKAGE.tar.gz" "$PACKAGE"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ripsem-${{ matrix.target }}
          path: ${{ env.PACKAGE }}.*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ripsem-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum ripsem-* > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/ripsem-*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" 'index($0, "## " v " ") == 1 {on = 1; next} /^## / {on = 0} on' \
            CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "ripsem $version" --notes-file notes.md dist/ripsem-* dist/SHA256SUMS

  # crates.io trusts this workflow by name too, so `cargo install ripsem` gets
  # the tag without a crates.io token stored here.
  crates:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The environment crates.io's trusted publishing config names.
    environment: ripsem-github
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # The same archives as npm packages, so `npx ripsem` works. Published through
  # npm's trusted publishing: npm trusts this workflow by name and hands it a
  # short-lived token, so no npm secret is stored here. Packed on Linux, which
  # keeps the binaries executable.
  npm:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ripsem-*
          path: dist
          merge-multiple: true
      - name: Publish
        run: |
          mkdir unpacked
          for archive in dist/*.tar.gz; do tar -xzf "$archive" -C unpacked; done
          for archive in dist/*.zip; do unzip -q "$archive" -d unpacked; done
          node npm/stage.mjs "${GITHUB_REF_NAME#v}" unpacked staged
          for package in staged/ripsem-*/ staged/ripsem/; do
            npm publish --access public "$package"
          done

  # Lists the npm package in the MCP Registry, where clients and catalogues
  # find servers. The registry trusts this workflow through GitHub's OIDC
  # token, so no secret is stored here. It reads the published package to
  # check its mcpName, and a new version can take a moment to appear on npm.
  mcp-registry:
    needs: npm
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Publish
        run: |
          version=${GITHUB_REF_NAME#v}
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz | tar -xz mcp-publisher
          jq --arg v "$version" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
          ./mcp-publisher login github-oidc
          for attempt in 1 2 3 4; do
            ./mcp-publisher publish && exit 0
            sleep 30
          done
          ./mcp-publisher publish
