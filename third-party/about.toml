# Settings for cargo-about, which the release workflow runs to list the Rust
# crates compiled into the binary and their licences.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "NCSA",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
# Neither is part of the binary: build scripts and tests only.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# onig_sys compiles the Oniguruma C library into the binary. Its own licence
# file covers only the Rust bindings and points at Oniguruma's for the rest.
[onig_sys.clarify]
license = "MIT AND BSD-2-Clause"

[[onig_sys.clarify.files]]
path = "LICENSE.md"
license = "MIT"
checksum = "71f321038b088358004bee991635ac09e4c703bec467d3c30c06992c0595f189"

[[onig_sys.clarify.files]]
path = "oniguruma/COPYING"
license = "BSD-2-Clause"
checksum = "70ba5469ea0bab6e18a32d7009068f996503168d27be57747e08da34337ff26f"
